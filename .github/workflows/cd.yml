name: CD

# Continuous delivery: build the API image, prove it actually serves /health,
# then publish it to the GitHub Container Registry (GHCR). No external secrets
# are needed -- the built-in GITHUB_TOKEN can push to this repo's registry.
#
# Runs on pushes to main and on version tags (v1.2.3 -> semver-tagged image),
# and can be triggered by hand from the Actions tab (workflow_dispatch) so you
# can test it from a feature branch before merging.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: backtester:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container must answer /health)
        run: |
          docker run -d --name backtester -p 8000:8000 backtester:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | grep -q ok; then
              ok=1; break
            fi
            sleep 2
          done
          docker logs backtester
          docker rm -f backtester
          if [ "$ok" != "1" ]; then
            echo "::error::/health never returned ok"; exit 1
          fi
          echo "image is healthy"

      - name: Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
